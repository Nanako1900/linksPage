# LinksPage configuration. Copied to config/config.yaml by init.sh.
# Precedence (low → high): built-in defaults → this file → LP_* environment
# variables ("__" = nesting) → LP_*_FILE. Most values are set in .env and
# compose.yaml; keep this file for settings that grant access.
# Validate after editing:
#   docker compose run --rm --no-deps app config check

# base_url is normally set via LP_BASE_URL in .env.
# base_url: https://links.example.com

# log:
#   level: info        # debug | info | warn | error
#   format: json       # json | text

# Send Strict-Transport-Security from the app (https base_url only). Leave
# off behind Cloudflare, which sets HSTS at the edge.
# hsts: false

# Initial content imported on first start when the page has no content
# yet (see config/seed.example.yaml; image paths are relative to the seed
# file's directory). Remove or keep it: later starts skip seeding.
# seed_file: /etc/linkspage/seed.yaml

# Image uploads (bytes; 64 KiB – 20 MiB).
# uploads:
#   max_bytes: 5242880

# Upstream API origins. Only change these for tests or mirrors.
# providers:
#   http_proxy: http://host.docker.internal:7890   # usually LP_PROVIDERS__HTTP_PROXY
#   discord:
#     api_base: https://discord.com
#   kook:
#     api_base: https://www.kookapp.cn

# Topology C (Cloudflare Worker front end): shared secret the Worker sends
# as X-LP-Proxy-Auth (≥32 bytes). Prefer LP_EDGE__PROXY_AUTH_FILE.
# edge:
#   proxy_auth_file: /run/secrets/edge_proxy_auth

# Administrators are defined only here (the database never grants access).
# Generate a hash with:
#   docker compose run --rm --no-deps app hash-password      (available from M2a)
# Plaintext `password` keys are rejected at startup.
auth:
  local:
    enabled: true
    users: []
    # users:
    #   - username: admin
    #     password_hash: "$argon2id$v=19$m=47104,t=1,p=1$<salt>$<hash>"
    #     role: owner      # owner | editor
    #   - username: editor
