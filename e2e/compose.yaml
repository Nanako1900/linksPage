# E2E stack: PostgreSQL + stub Discord/KOOK upstream + the app image +
# the Playwright runner. Run through e2e/run.sh (also used by CI).
#
# Every service sits on an internal network: nothing in this stack can
# reach the internet, so a test can never hit the real Discord or KOOK.
# The runner shares the app's network namespace and talks to
# http://localhost:8080, which keeps the page a secure context (the
# Clipboard API needs one).
name: linkspage-e2e

services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: linkspage
      POSTGRES_DB: linkspage
      POSTGRES_PASSWORD: linkspage-e2e
    tmpfs: [/var/lib/postgresql]
    networks: [e2e]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkspage -d linkspage"]
      interval: 2s
      timeout: 5s
      retries: 30

  stub:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    command: ["node", "/stub/server.mjs"]
    user: node
    environment:
      STUB_PORT: "8090"
      FIXTURE_ROOT: /fixtures
    volumes:
      - ./stub:/stub:ro
      - ../internal/provider/discord/testdata:/fixtures/discord/testdata:ro
      - ../internal/provider/kook/testdata:/fixtures/kook/testdata:ro
    networks: [e2e]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/__stub/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    image: ${E2E_APP_IMAGE:-linkspage:e2e}
    environment:
      LP_BASE_URL: http://localhost:8080
      LP_DB__HOST: db
      LP_DB__USER: linkspage
      LP_DB__NAME: linkspage
      LP_DB__PASSWORD: linkspage-e2e
      LP_SEED_FILE: /e2e/seed/seed.yaml
      LP_PROVIDERS__DISCORD__API_BASE: http://stub:8090
      LP_PROVIDERS__KOOK__API_BASE: http://stub:8090
      LP_LOG__FORMAT: text
    volumes: ["./seed:/e2e/seed:ro"]
    networks: [e2e]
    depends_on:
      db: { condition: service_healthy }
      stub: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/linkspage", "healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 60

  playwright:
    build: { context: ., dockerfile: Dockerfile }
    image: linkspage-e2e-runner:local
    network_mode: "service:app"
    environment:
      CI: ${CI:-}
      E2E_BASE_URL: http://localhost:8080
      E2E_STUB_URL: http://stub:8090
    volumes:
      - ./test-results:/e2e/test-results
      - ./playwright-report:/e2e/playwright-report
    depends_on:
      app: { condition: service_healthy }
    # Chromium needs more than the default 64 MB of /dev/shm.
    shm_size: 1gb
    init: true

networks:
  e2e:
    internal: true
