# LinksPage — production compose file. See docs/tech-selection.md §12.
# Compose-only variables use the LINKSPAGE_* prefix; the app reads LP_*.
name: linkspage

x-logging: &logging
  driver: local
  options: { max-size: "10m", max-file: "3" }

services:
  app:
    image: ${LINKSPAGE_IMAGE:-ghcr.io/nanako1900/linkspage}:${LINKSPAGE_TAG:-0.1}
    restart: unless-stopped
    # Listed one by one (no env_file) so the whole .env is never injected.
    environment:
      LP_BASE_URL: ${LP_BASE_URL:?set LP_BASE_URL in .env}
      LP_DB__HOST: db
      LP_DB__USER: linkspage
      LP_DB__NAME: linkspage
      LP_DB__PASSWORD_FILE: /run/secrets/pg_password
      LP_TRUSTED_PROXIES: ${LP_TRUSTED_PROXIES:-172.31.255.2/32}
      LP_CLIENT_IP_HEADER: ${LP_CLIENT_IP_HEADER:-CF-Connecting-IP}
      LP_PROVIDERS__HTTP_PROXY: ${LP_PROVIDERS__HTTP_PROXY:-}
      LP_ANALYTICS__TIMEZONE: ${LP_ANALYTICS__TIMEZONE:-Asia/Shanghai}
      GOMEMLIMIT: 300MiB
    # Add OAuth secrets or admin password hash files in compose.override.yaml.
    secrets: [pg_password]
    # Mount the config directory, not single files.
    volumes: ["app-data:/data", "./config:/etc/linkspage:ro"]
    # Lets the app reach a proxy running on the host.
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [edge, backend]
    depends_on:
      db: { condition: service_healthy, restart: true }
    healthcheck:
      test: ["CMD", "/linkspage", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { memory: 384M, cpus: "1.0" } } }
    stop_grace_period: 30s
    logging: *logging
    # No published ports by default. For direct access or local debugging
    # add deploy/compose.direct.yaml.

  db:
    image: ${LINKSPAGE_PG_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkspage
      POSTGRES_DB: linkspage
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    # PostgreSQL 18+ mount point.
    volumes: ["db-data:/var/lib/postgresql"]
    networks: [backend]
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkspage -d linkspage"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # The entrypoint chowns the volume and drops to the postgres user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { memory: 512M } } }
    logging: *logging

  cloudflared:
    image: ${LINKSPAGE_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.9.3}
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run --token-file /run/secrets/tunnel_token
    secrets: [tunnel_token]
    networks:
      edge: { ipv4_address: 172.31.255.2 }
    depends_on:
      app: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    logging: *logging

  backup:
    # FROM postgres:18-alpine with the backup script and age (deploy/backup).
    image: ${LINKSPAGE_BACKUP_IMAGE:-ghcr.io/nanako1900/linkspage-backup}:${LINKSPAGE_TAG:-0.1}
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_UID: ${BACKUP_UID:-1000}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    secrets: [pg_password]
    volumes:
      - ./backups:/backups
      - app-data:/data:ro
      - ./config:/src/config:ro
      # Only secrets/admin_* are archived (see deploy/backup/backup.sh).
      - ./secrets:/src/secrets:ro
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    # Runs as root to read files owned by 65532 and chown the archives.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

secrets:
  # Generated by init.sh; the secrets/ directory is mode 0700.
  pg_password: { file: ./secrets/pg_password }
  tunnel_token: { file: ./secrets/tunnel_token }

networks:
  # Dynamic addresses come only from ip_range, so .2 stays reserved for
  # cloudflared (the trusted proxy). Never give app a static IP: containers
  # started with `compose run` would inherit it and conflict. On subnet
  # conflicts change the subnet, ipv4_address and LP_TRUSTED_PROXIES together.
  edge:
    ipam:
      config: [{ subnet: 172.31.255.0/28, ip_range: 172.31.255.8/29 }]
  backend:
    internal: true

volumes:
  app-data: {}
  db-data: {}
